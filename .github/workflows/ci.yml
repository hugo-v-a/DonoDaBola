# Roda os testes do Core e do Data em todo push na main e em todo pull request.
# Os projetos da Stride não são compilados aqui: exigem Windows e são lentos.
name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  core-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - run: dotnet test DonoDaBola.Core.Tests
      - run: dotnet test DonoDaBola.Data.Tests
